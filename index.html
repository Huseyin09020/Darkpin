<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKPİN | Güvenli E-Pin Marketiniz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo" id="main-logo">
            <h2>DARK<span>PİN</span></h2>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Hangi oyunu arıyorsun?">
            <button onclick="triggerSearch()">Ara</button>
        </div>
        
        <div class="user-actions">
            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()">☀️</button>
            <div class="user-wallet">💳 Bakiye: <span id="balance-amount">1500.00</span> TL</div>
            <button class="orders-btn" onclick="openOrders()">📦 Siparişlerim</button>
            <button class="cart-btn">Sepetim <span class="cart-count">0</span></button>
        </div>
    </header>

    <div class="hero-banner">
        <div class="hero-content">
            <h1>DARKPİN'de Efsane Sezon Başladı!</h1>
            <p>En popüler oyunların e-pinleri anında teslimat ve %100 güvenle sizlerle.</p>
        </div>
    </div>

    <main class="container">
        <h2 class="section-title">Popüler Ürünler</h2>
        
        <div class="filter-bar">
            <div class="category-filters">
                <button class="filter-btn active" onclick="filterProducts('All', this)">Tümü</button>
                <button class="filter-btn" onclick="filterProducts('Valorant', this)">Valorant</button>
                <button class="filter-btn" onclick="filterProducts('Counter-Strike 2', this)">CS2</button>
                <button class="filter-btn" onclick="filterProducts('PUBG', this)">PUBG</button>
                <button class="filter-btn" onclick="filterProducts('eFootball', this)">eFootball</button>
                <button class="filter-btn" onclick="filterProducts('Steam', this)">Steam</button>
            </div>
            
            <select id="sort-options" class="sort-select" onchange="sortProducts(this.value)">
                <option value="default">Sıralama Seç</option>
                <option value="asc">En Ucuz</option>
                <option value="desc">En Pahalı</option>
            </select>
        </div>

        <div id="product-list" class="grid-layout"></div>
    </main>

    <!-- Sepet Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCart()">&times;</span>
            <h2>Sepetim</h2>
            <div id="cart-items"></div>
            <div class="promo-box">
                <input type="text" id="promo-input" placeholder="Kupon (Örn: DARK10)">
                <button onclick="applyPromo()">Uygula</button>
            </div>
            <div class="cart-total">
                <h3>Toplam: <span id="total-price">0</span> TL</h3>
                <button class="checkout-btn" onclick="checkout()">Satın Al</button>
            </div>
        </div>
    </div>

    <!-- Sipariş Geçmişi Modal -->
    <div id="orders-modal" class="modal hidden">
        <div class="modal-content orders-modal-content">
            <span class="close-btn" onclick="closeOrders()">&times;</span>
            <h2>Sipariş Geçmişim</h2>
            <div id="orders-list"></div>
        </div>
    </div>

    <!-- YENİ: Ürün Detay Modal -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content detail-modal-content">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <div id="detail-content" class="detail-grid">
                <!-- İçerik JS ile buraya basılacak -->
            </div>
        </div>
    </div>

    <!-- YENİ: Gizli Admin Panel Modal -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAdmin()">&times;</span>
            <h2>⚙️ Yönetim Paneli</h2>
            <p style="margin-bottom: 15px; color: #888;">Yeni ürün eklemek için formu doldurun.</p>
            
            <div class="admin-form">
                <input type="text" id="admin-name" placeholder="Ürün Adı" required>
                <input type="text" id="admin-cat" placeholder="Kategori (Örn: Valorant)" required>
                <input type="number" id="admin-price" placeholder="Fiyat" required>
                <input type="text" id="admin-img" placeholder="Görsel Linki (URL)" required>
                <select id="admin-stock">
                    <option value="true">Stokta Var</option>
                    <option value="false">Tükendi</option>
                </select>
                <button class="checkout-btn" onclick="addNewProduct()">Ürünü Ekle</button>
            </div>
            <button class="checkout-btn" style="background-color:#ff0055; margin-top:20px;" onclick="resetDatabase()">Veritabanını Sıfırla (İlk Haline Dön)</button>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
