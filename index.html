<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKPİN | Güvenli E-Pin Marketiniz</title>
    <!-- CSS Dosyamızı Bağlıyoruz -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ÜST MENÜ (NAVBAR) -->
    <header class="navbar">
        <div class="logo">
            <!-- DARK kısmını beyaz, PİN kısmını renkli yapacağız -->
            <h2>DARK<span>PİN</span></h2>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Hangi oyunu arıyorsun? (Örn: Valorant)">
            <button>Ara</button>
        </div>
        
        <div class="cart-menu">
            <button class="cart-btn">
                Sepetim <span class="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- ÜRÜNLERİN LİSTELENECEĞİ ALAN -->
    <main class="container">
        <h2 class="section-title">Popüler Ürünler</h2>
        <!-- JavaScript ile ürünleri bu div'in içine göndereceğiz -->
        <div id="product-list" class="grid-layout">
            <!-- Şimdilik burası boş, JS ile dolacak -->
        </div>
    </main>

    <!-- JavaScript Dosyamızı Bağlıyoruz -->
    <script src="app.js"></script>
</body>
</html>
